<!-- INICIO: presentación de Isabel y música para Alejo -->
<style>
  .menu{white-space:nowrap}
  .mobile-panel{overflow-y:auto;overscroll-behavior:contain}
  .foundation-layout{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:36px;align-items:start}
  .foundation-layout .section-intro{margin-top:0;margin-bottom:26px}
  .foundation-layout .about-grid{grid-template-columns:1fr;gap:18px}
  .profile-card{background:var(--paper,#fffaf3);border:1px solid rgba(185,154,94,.42);border-radius:24px;padding:32px;box-shadow:var(--shadow);scroll-margin-top:100px}
  .profile-card h3{font-family:Georgia,serif;font-size:32px;line-height:1.2;font-weight:500;color:var(--chocolate,#4c2f26);margin:0 0 10px}
  .profile-role{font-size:13px;color:var(--muted,#786a63);margin:0 0 24px}
  .profile-credentials{padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:24px}
  .profile-degree{font-family:Georgia,serif;font-size:23px;line-height:1.35;color:var(--chocolate,#4c2f26);margin:0 0 8px}
  .profile-institution{font-size:12px;letter-spacing:.05em;color:var(--muted,#786a63);margin:0 0 18px}
  .profile-professions{font-size:16px;font-weight:600;color:var(--chocolate-2,#6d4739);margin:0}
  .profile-story{font-size:16px;color:#65574f;margin:0 0 16px}
  .profile-signature{font-family:Georgia,serif;font-size:20px;font-style:italic;line-height:1.45;color:var(--chocolate-2,#6d4739);margin:24px 0 0}
  .alejo-media{min-width:0}
  .alejo-music{margin-top:18px;padding:20px;border:1px solid rgba(216,192,141,.35);border-radius:22px;background:rgba(255,250,243,.05)}
  .alejo-music summary{display:flex;align-items:center;gap:12px;cursor:pointer;list-style:none;color:#fff7ec;font-family:Georgia,serif;font-size:20px;line-height:1.3}
  .alejo-music summary::-webkit-details-marker{display:none}
  .alejo-music summary:focus-visible{outline:2px solid #d8c08d;outline-offset:7px;border-radius:4px}
  .alejo-music summary:after{content:"+";margin-left:auto;color:#d8c08d;font-size:24px}
  .alejo-music[open] summary:after{content:"−"}
  .alejo-music summary small{display:block;font-family:system-ui,sans-serif;font-size:12px;line-height:1.5;color:#e7dbd2;margin-top:5px}
  .alejo-music-icon{display:grid;place-items:center;flex:0 0 38px;width:38px;height:38px;border:1px solid rgba(216,192,141,.5);border-radius:50%;color:#d8c08d;font-size:15px}
  .alejo-music-player{margin-top:20px;border-radius:14px;overflow:hidden;background:#201613}
  .alejo-music-player iframe{display:block;width:100%;aspect-ratio:16/9;min-height:200px;border:0}
  .alejo-music-credit{font-size:12px;color:#e7dbd2;margin:14px 0 0}

  @media(min-width:901px) and (max-width:1100px){
    .nav{gap:16px}
    .brand-title{font-size:15px}
    .menu{gap:14px;font-size:13px}
  }

  @media(max-width:900px){
    .foundation-layout{grid-template-columns:1fr}
    .alejo-media{max-width:520px;width:100%}
  }

  @media(max-width:620px){
    .profile-card{padding:26px;scroll-margin-top:90px}
    .profile-card h3{font-size:29px}
  }
</style>

<script>
(() => {
  const foundation = document.querySelector('#fundacion .container');

  if (foundation && !document.getElementById('quienes-somos')) {
    let layout = foundation.querySelector('.foundation-layout');

    if (!layout) {
      layout = document.createElement('div');
      layout.className = 'foundation-layout';

      const copy = document.createElement('div');
      const intro = foundation.querySelector('.section-intro');
      const panels = foundation.querySelector('.about-grid');

      if (intro) copy.appendChild(intro);
      if (panels) copy.appendChild(panels);

      layout.appendChild(copy);
      foundation.appendChild(layout);
    }

    layout.insertAdjacentHTML('beforeend', `
      <aside class="profile-card" id="quienes-somos"
             aria-labelledby="profile-name">

        <div class="section-kicker">Quiénes somos</div>
        <h3 id="profile-name">Isabel Elisa Strizik</h3>

        <p class="profile-role">
          Impulsora de la Fundación Tanatológica Alejo
        </p>

        <div class="profile-credentials" aria-label="Formación">
          <p class="profile-degree">
            Diplomada en Tanatología y Logoterapia
          </p>
          <p class="profile-institution">
            CRAPTICA/PRACTIS SAC · 2026
          </p>
          <p class="profile-professions">
            Abogada, escriba y mediadora
          </p>
        </div>

        <p class="profile-story">
          La partida de mi hijo Alejo me llevó a buscar nuevas formas
          de comprender el duelo y de dar un lugar al amor que permanece.
        </p>

        <p class="profile-story">
          De esa experiencia y de mi formación nace este proyecto:
          acompañar a quienes atraviesan una pérdida, abrir conversaciones
          sobre la muerte y transformar la memoria en obras de amor.
        </p>

        <p class="profile-signature">
          Estamos heridos, pero podemos seguir amando.
        </p>
      </aside>
    `);
  }

  if (document.getElementById('quienes-somos')) {
    document.querySelectorAll('.menu, #mobilePanel nav').forEach(nav => {
      if (nav.querySelector('a[href="#quienes-somos"]')) return;

      const link = document.createElement('a');
      link.href = '#quienes-somos';
      link.textContent = 'Quiénes somos';

      nav.insertBefore(link, nav.querySelector('a[href="#contacto"]'));

      if (nav.closest('#mobilePanel')) {
        link.addEventListener('click', () => {
          if (typeof setMenu === 'function') setMenu(false);
        });
      }
    });
  }

  const photo = document.querySelector('#alejo .alejo-visual');

  if (photo && !document.getElementById('alejoMusic')) {
    let media = photo.closest('.alejo-media');

    if (!media) {
      media = document.createElement('div');
      media.className = 'alejo-media';
      photo.before(media);
      media.appendChild(photo);
    }

    media.insertAdjacentHTML('beforeend', `
      <details class="alejo-music" id="alejoMusic">
        <summary>
          <span class="alejo-music-icon" aria-hidden="true">▶</span>
          <span>
            Una canción para Alejo
            <small>Cómo olvidarme · La Beriso</small>
          </span>
        </summary>

        <div class="alejo-music-player">
          <iframe
            id="alejoSong"
            title="Cómo olvidarme de La Beriso: fragmento para Alejo"
            data-src="https://www.youtube-nocookie.com/embed/uo8qDCDZhK0?start=246&amp;end=271&amp;autoplay=0&amp;playsinline=1&amp;rel=0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
          </iframe>
        </div>

        <p class="alejo-music-credit">
          La Beriso · Video de su canal oficial LaBerisoVEVO.
        </p>
      </details>
    `);

    const music = document.getElementById('alejoMusic');
    const player = document.getElementById('alejoSong');

    music.addEventListener('toggle', () => {
      if (music.open) {
        player.setAttribute('src', player.dataset.src);
      } else {
        player.removeAttribute('src');
      }
    });
  }
})();
</script>
<!-- FIN: presentación de Isabel y música para Alejo -->
