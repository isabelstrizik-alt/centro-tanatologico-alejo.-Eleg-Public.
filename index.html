<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preparar página — Fundación Tanatológica Alejo</title>

<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    padding:30px 18px;
    background:#f6f0e6;
    color:#4c2f26;
    font-family:Arial,sans-serif;
    line-height:1.6;
  }
  main{
    max-width:720px;
    margin:auto;
    padding:30px;
    background:#fffaf3;
    border:1px solid #d8c08d;
    border-radius:22px;
  }
  h1{
    font-family:Georgia,serif;
    font-size:30px;
    font-weight:normal;
    line-height:1.2;
  }
  label{display:block;font-weight:bold;margin:24px 0 8px}
  input{display:block;width:100%;padding:12px;border:1px solid #d8c08d}
  button,.download{
    display:inline-block;
    padding:14px 20px;
    margin:20px 10px 0 0;
    border:0;
    border-radius:12px;
    background:#4c2f26;
    color:white;
    font-size:16px;
    text-decoration:none;
    cursor:pointer;
  }
  button:disabled{opacity:.6;cursor:wait}
  details{margin-top:24px}
  summary{cursor:pointer}
  #status{margin-top:24px}
  [hidden]{display:none!important}
</style>
</head>

<body>
<main>
  <h1>Actualizar “Quiénes somos”</h1>
  <p>
    Agregá las fotos de Agustín y Denis para preparar
    el archivo completo de la Fundación Tanatológica Alejo.
  </p>

  <label for="photoA">Foto de Ariel Agustín Kossoy Strizik</label>
  <input id="photoA" type="file" accept="image/jpeg,image/png,image/webp">

  <label for="photoD">Foto de Denis Bulan</label>
  <input id="photoD" type="file" accept="image/jpeg,image/png,image/webp">

  <details>
    <summary>Usar mi archivo actual, si no se recupera automáticamente</summary>
    <label for="baseFile">Código completo anterior</label>
    <input id="baseFile" type="file" accept=".html,.txt,text/html,text/plain">
  </details>

  <button id="create" type="button">Preparar código completo</button>

  <p id="status" role="status" aria-live="polite"></p>

  <div id="downloads" hidden>
    <a class="download" id="txtDownload">Descargar código completo .txt</a>
    <a class="download" id="htmlDownload">Descargar index.html</a>
  </div>
</main>

<script>
const BASE =
  'https://raw.githubusercontent.com/isabelstrizik-alt/centro-tanatologico-alejo.-Eleg-Public./136676ae9593eace9a7821587c33a0888fd6a964/index.html';

const styles = `<style id="familia-alejo-estilos">
.team-column{
  display:grid;
  gap:22px;
  min-width:0;
}
.family-member{
  padding:26px;
  background:var(--paper);
  border:1px solid rgba(185,154,94,.42);
  border-radius:24px;
  box-shadow:var(--shadow);
}
.family-head{
  display:grid;
  grid-template-columns:112px minmax(0,1fr);
  gap:18px;
  align-items:center;
  margin-bottom:20px;
}
.family-photo{
  display:block;
  width:112px;
  height:140px;
  border-radius:16px;
  overflow:hidden;
  background:var(--ivory);
}
.family-member h3{
  font-family:Georgia,serif;
  font-size:25px;
  line-height:1.2;
  color:var(--chocolate);
  font-weight:500;
  margin:0 0 10px;
}
.family-role{
  font-size:13px;
  color:var(--muted);
  margin:0;
}
.family-member p:not(.family-role){
  font-size:16px;
  color:#65574f;
  margin:0 0 16px;
}
.family-member blockquote{
  font-family:Georgia,serif;
  font-size:20px;
  line-height:1.5;
  font-style:italic;
  color:var(--chocolate-2);
  margin:22px 0 0;
  padding-top:18px;
  border-top:1px solid var(--line);
}
@media(max-width:620px){
  .family-head{
    grid-template-columns:96px minmax(0,1fr);
    gap:14px;
  }
  .family-photo{width:96px;height:120px}
  .family-member h3{font-size:23px}
}
</style>`;

function addFamily(html, photoA, photoD) {
  const pattern =
    /<aside\b(?=[^>]*\bid=["']quienes-somos["'])[^>]*>[\s\S]*?<\/aside>/i;

  const found = html.match(new RegExp(pattern.source, 'gi'));

  if (!found || found.length !== 1) {
    throw new Error('No se encontró tu presentación en el archivo.');
  }

  if (html.includes('id="familia-alejo-estilos"')) {
    throw new Error('El archivo ya contiene estos agregados.');
  }

  const cards = `
<article class="family-member" id="agustin" aria-labelledby="agustin-nombre">
  <div class="family-head">
    ${photoA}
    <div>
      <h3 id="agustin-nombre">Ariel Agustín Kossoy Strizik</h3>
      <p class="family-role">
        Hermano de Alejo · Colaborador de la Fundación
      </p>
    </div>
  </div>

  <p>Agustín acompaña este proyecto con el amor de quien compartió con Alejo una historia de hermanos. Con su presencia y colaboración, ayuda a sostener la Fundación y a transformar su memoria en obras de amor para otros.</p>

  <p>El vínculo entre hermanos permanece: vive en los recuerdos, en lo aprendido juntos y en nuevas maneras de seguir amando.</p>
</article>

<article class="family-member" id="denis" aria-labelledby="denis-nombre">
  <div class="family-head">
    ${photoD}
    <div>
      <h3 id="denis-nombre">Denis Bulan</h3>
      <p class="family-role">
        Un vínculo de crianza, amor y vida compartida
      </p>
    </div>
  </div>

  <p>Denis acompañó a Alejo en su crianza y compartió con él la vida cotidiana, construyendo un vínculo de profundo cariño y cercanía. Esa historia compartida forma parte de las raíces de la Fundación.</p>

  <p>Hoy acompaña este proyecto con el deseo de que el amor por Alejo siga encontrando caminos para cuidar, ayudar y estar cerca de otros.</p>

  <blockquote>“Te acompañé a crecer y compartimos la vida. Hoy encuentro en cada obra de amor una manera de seguir honrando nuestro vínculo.”</blockquote>
</article>`;

  return html
    .replace(
      pattern,
      original =>
        '<div class="team-column">\n' +
        original + '\n' + cards + '\n</div>'
    )
    .replace(/<\/head>/i, styles + '\n</head>');
}

function readPhoto(file, name, screenshot) {
  if (!file) {
    return Promise.reject(new Error('Elegí la foto de ' + name + '.'));
  }

  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) {
    return Promise.reject(
      new Error('Usá una foto JPG, PNG o WebP para ' + name + '.')
    );
  }

  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onerror = () =>
      reject(new Error('No se pudo leer la foto de ' + name + '.'));

    reader.onload = () => {
      const image = new Image();

      image.onerror = () =>
        reject(new Error('No se pudo abrir la foto de ' + name + '.'));

      image.onload = () => {
        const w = image.naturalWidth;
        const h = image.naturalHeight;

        // Encuadre de las dos imágenes compartidas.
        // Las fotografías originales permanecen incorporadas sin retoques.
        const y = h * (screenshot ? 0.2233 : 0.30);
        const cropH = h * (screenshot ? 0.5573 : 0.70);

        resolve(
          `<svg class="family-photo"
            width="400" height="500"
            viewBox="0 ${y} ${w} ${cropH}"
            preserveAspectRatio="xMidYMin slice"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="Retrato de ${name}">
            <title>${name}</title>
            <image href="${reader.result}" width="${w}" height="${h}" />
          </svg>`
        );
      };

      image.src = reader.result;
    };

    reader.readAsDataURL(file);
  });
}

let urls = [];

document.getElementById('create').addEventListener('click', async () => {
  const button = document.getElementById('create');
  const status = document.getElementById('status');
  const links = document.getElementById('downloads');

  button.disabled = true;
  links.hidden = true;
  status.textContent = 'Preparando el código completo…';

  try {
    const a = document.getElementById('photoA').files[0];
    const d = document.getElementById('photoD').files[0];
    const local = document.getElementById('baseFile').files[0];

    if (!a || !d) {
      throw new Error('Elegí las dos fotos antes de continuar.');
    }

    let html;

    if (local) {
      html = await local.text();
    } else {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 45000);

      try {
        const response = await fetch(BASE, {
          signal: controller.signal
        });

        if (!response.ok) {
          throw new Error('No se pudo recuperar la página.');
        }

        html = await response.text();
      } catch (error) {
        throw new Error(
          'No se pudo recuperar la página. En “Usar mi archivo actual”, ' +
          'elegí tu index.html o el archivo de código completo y volvé a intentar.'
        );
      } finally {
        clearTimeout(timer);
      }
    }

    const [photoA, photoD] = await Promise.all([
      readPhoto(a, 'Ariel Agustín Kossoy Strizik', true),
      readPhoto(d, 'Denis Bulan', false)
    ]);

    const result = addFamily(
      html.replace(/\r\n/g, '\n'),
      photoA,
      photoD
    );

    urls.forEach(url => URL.revokeObjectURL(url));
    urls = [];

    for (const [id, name, type] of [
      ['htmlDownload', 'index.html', 'text/html;charset=utf-8'],
      ['txtDownload', 'index_codigo_completo.txt', 'text/plain;charset=utf-8']
    ]) {
      const url = URL.createObjectURL(new Blob([result], { type }));
      urls.push(url);

      const link = document.getElementById(id);
      link.href = url;
      link.download = name;
    }

    links.hidden = false;
    status.textContent =
      'Listo. Descargá el código completo y pegá todo su contenido ' +
      'en index.html de GitHub.';
  } catch (error) {
    status.textContent =
      error.message || 'No se pudo completar el archivo.';
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
